name: Bug report
description: Something is broken or behaves differently from its documentation
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first, and do **not** report security vulnerabilities here; see `SECURITY.md`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did and what you saw. Include the exact error message or a screenshot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, image tag or commit you saw it on.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with secrets removed.
      render: text
