name: Feature request
description: A change in behaviour, scoped well enough to build
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: How we will know it is done. One checkable statement per line.
      placeholder: |
        - [ ] ...
    validations:
      required: true
